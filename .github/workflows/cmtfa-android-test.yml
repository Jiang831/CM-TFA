name: CM-TFA Android Test APK (v2.11.37)

on:
  push:
    branches:
      - cmtfa/v2.11.37-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmtfa-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout fixed source and submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify official CMFA release baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 215e017ae88ac2a1edf24fdb520512c1423c89f4 HEAD
          actual=$(git -C core/src/foss/golang/clash rev-parse HEAD)
          expected=0455d0d28c4526937380505153e65a843d8612e8
          test "$actual" = "$expected" || { echo "Unexpected Mihomo submodule: $actual" >&2; exit 1; }
          grep -F 'versionName = "2.11.37"' build.gradle.kts
          echo "Official app baseline and Android kernel revision verified"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Official MetaCubeX Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'

      - name: Apply official Go toolchain patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            if [ -f "$p" ]; then patch --verbose -p 1 < "$p"; fi
          done

      - name: Prepare unique Android package and label
        run: python3 tools/cmtfa/configure_build.py --repo-root .

      - name: Refresh trusted CA bundle (upstream-compatible)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build independent Android ARM64 APK
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Check APK output and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/alpha/release/*-arm64-v8a-*.apk)
          if (( ${#apks[@]} == 0 )); then echo 'No ARM64 APK generated' >&2; exit 1; fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$apksigner"
          for apk in "${apks[@]}"; do
            "$apksigner" verify --min-sdk-version 21 "$apk"
            cp "$apk" dist/
          done
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          cat > dist/BUILD-NOTES.txt <<'EOF'
          CM-TFA v2.11.37 baseline (development only)
          Unique Android package ID: com.jiang831.cmtfa
          Compatible with original CMFA installation at package-ID level.
          Build signing uses upstream test/debug signing fallback.
          IMPORTANT: This baseline APK has NO Tailscale ADB inbound implementation.
          Do NOT import R10 experimental listener YAML until custom core integration passes.
          Do NOT use this build for production or replace existing CMFA.
          EOF
          ls -lh dist

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: CM-TFA-v2.11.37-Baseline-ARM64-Test
          path: dist/*
          if-no-files-found: error
          retention-days: 14
